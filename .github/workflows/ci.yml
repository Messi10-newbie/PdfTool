# Builds the solution and runs the tests on every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest   # WinForms + Windows.Data.Pdf need Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PdfTool.slnx

      - name: Build
        run: dotnet build PdfTool.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PdfTool.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()   # keep the results even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
